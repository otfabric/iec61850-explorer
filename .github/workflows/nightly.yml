# Extended tier (otfabric/engineering standards/testing.md#ci-tiers): longer
# fuzzing, which normal CI skips. A fuzz failure leaves its input in the
# artifact: commit it with the fix.
name: Nightly
run-name: "Nightly on ${{ github.ref_name }}"

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz-time:
        description: Time per fuzz target
        required: false
        default: 5m

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Stable, as in go-ci: Go 1.26's fuzz coordinator has a race.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fuzz FUZZTIME=${{ inputs.fuzz-time || '5m' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly
          path: "**/testdata/fuzz/"
